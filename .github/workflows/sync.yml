name: Product Sync Pipeline

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r ad_generator/requirements.txt

      - name: Run product sync via RapidAPI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_COUNTRY: ${{ vars.RAPIDAPI_COUNTRY }}
        run: cd backend/scraper && python main.py

      - name: Generate ad creatives (Pillow)
        run: cd backend/ad_generator && python generate_images.py

      - name: Upload ad creatives
        uses: actions/upload-artifact@v4
        with:
          name: ad-creatives
          path: backend/ad_generator/output/

  notify:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Send notification (optional)
        run: echo "Sync completed successfully"
